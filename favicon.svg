<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>
  
  <!-- Left Card (Slightly tilted) -->
  <g transform="translate(18, 33) rotate(-12)">
    <rect x="-12" y="-17" width="24" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="-9" y="-14" width="18" height="28" rx="3" fill="url(#cardGrad1)"/>
    <!-- Smiling Star Emblem -->
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#ffffff"/>
  </g>

  <!-- Right Card (Matching twin tilted opposite) -->
  <g transform="translate(43, 31) rotate(12)">
    <rect x="-12" y="-17" width="24" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="-9" y="-14" width="18" height="28" rx="3" fill="url(#cardGrad2)"/>
    <!-- Matching Smiling Star Emblem -->
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#ffffff"/>
  </g>

  <!-- Golden Match Sparkle -->
  <circle cx="32" cy="14" r="3" fill="#fde047"/>
  <circle cx="50" cy="18" r="1.5" fill="#ffffff"/>
  <circle cx="14" cy="48" r="2" fill="#38bdf8"/>
</svg>
